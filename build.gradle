plugins {
    id 'base'
}

allprojects {
    group = 'com.radig.smartmendcraft'
    version = providers.gradleProperty('mod_version').get()
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Keep mod and mixin bytecode at the highest level supported by the
        // Mixin runtime bundled with Forge. Minecraft itself still runs on Java 25.
        options.release = 17
    }
}
